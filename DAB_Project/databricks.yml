# This is a Declarative Automation Bundle definition for DAB_Project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: DAB_Project
  uuid: d765aaeb-00da-4390-867a-9c0e31c5e48a

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
    workspace:
      host: https://dbc-ab78384a-2a28.cloud.databricks.com/?o=1455419226456971
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    presets:
      name_prefix: prod_${workspace.current_user.short_name}
    workspace:
      host: https://dbc-ab78384a-2a28.cloud.databricks.com/?o=1455419226456971
      # We explicitly deploy to /Workspace/Users/neeleshpalla@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/neeleshpalla@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: neeleshpalla@gmail.com
        level: CAN_MANAGE
